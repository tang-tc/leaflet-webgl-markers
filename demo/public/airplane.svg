<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d9f4ff" />
    </linearGradient>
  </defs>
  <!-- Fuselage: wide at the tail, tapering to a sharp nose at the top. -->
  <path d="M32 4 C37 14 39 26 39 43 L25 43 C25 26 27 14 32 4 Z" fill="url(#fus)" />
  <!-- Swept wings. -->
  <path d="M31 27 L31 39 L10 47 L14 33 Z" fill="#38e1ff" />
  <path d="M33 27 L33 39 L54 47 L50 33 Z" fill="#38e1ff" />
  <!-- Horizontal tailplane. -->
  <rect x="24" y="51" width="16" height="5" rx="2.5" fill="#38e1ff" />
  <!-- Subtle outline so the silhouette stays readable over bright tiles. -->
  <path d="M32 4 C37 14 39 26 39 43 L25 43 C25 26 27 14 32 4 Z"
        fill="none" stroke="#0b4f66" stroke-opacity="0.55" stroke-width="1.5" />
</svg>
